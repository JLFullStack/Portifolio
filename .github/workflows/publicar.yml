# Publica o portfólio no Cloudflare: aplica as migrações novas do D1, exporta o conteúdo
# do banco, gera a landing (next build) e faz o deploy do Worker com os arquivos estáticos.
#
# Disparado por:
#   - push no master (código novo);
#   - botão "Publicar" do painel (repository_dispatch "publicar", enviado pelo Worker em
#     worker/publicar.js com o id da publicação, que este workflow marca como concluída ou falha);
#   - à mão: aba Actions → Publicar → Run workflow.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com "Workers Scripts: Edit" e "D1: Edit" (modelo "Edit Cloudflare Workers" + D1)
#   CLOUDFLARE_ACCOUNT_ID  id da conta Cloudflare
name: Publicar

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [publicar]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLICACAO: ${{ github.event.client_payload.publicacao }}
      CI: "true"
    steps:
      - name: Conferir os segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrações do banco
        run: npx wrangler d1 migrations apply portifolio --remote

      - name: Exportar o conteúdo, gerar e publicar
        run: npm run deploy

      - name: Registrar o resultado no painel
        if: always() && env.PUBLICACAO != ''
        run: |
          if ! [[ "$PUBLICACAO" =~ ^[0-9]+$ ]]; then echo "id de publicação inválido"; exit 1; fi
          if [ "$RESULTADO" = "success" ]; then situacao=concluida; else situacao=falhou; fi
          npx wrangler d1 execute portifolio --remote --command \
            "UPDATE publicacoes SET situacao = '$situacao', concluida_em = datetime('now') WHERE id = $PUBLICACAO"
        env:
          RESULTADO: ${{ job.status }}
